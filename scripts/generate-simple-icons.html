<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Iconos PWA - FLYZULU</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #0a0a0a;
      color: #fafafa;
    }
    .canvas-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    canvas {
      border: 2px solid #0066CC;
      border-radius: 8px;
    }
    button {
      background: #0066CC;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 10px 10px 0;
    }
    button:hover {
      background: #0088FF;
    }
    .info {
      background: #141414;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #0066CC;
    }
  </style>
</head>
<body>
  <h1>Generador de Iconos PWA - FLYZULU</h1>

  <div class="info">
    <h3>Instrucciones</h3>
    <ol>
      <li>Los iconos se generarán automáticamente al cargar la página</li>
      <li>Haz clic en los botones para descargar cada icono</li>
      <li>Guarda los archivos en <code>public/icons/</code></li>
    </ol>
  </div>

  <div class="canvas-container">
    <div>
      <h3>Icon 192x192</h3>
      <canvas id="canvas192" width="192" height="192"></canvas>
      <br>
      <button onclick="downloadIcon(192)">Descargar icon-192.png</button>
    </div>

    <div>
      <h3>Icon 512x512</h3>
      <canvas id="canvas512" width="512" height="512"></canvas>
      <br>
      <button onclick="downloadIcon(512)">Descargar icon-512.png</button>
    </div>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      // Background
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, size, size);

      // Outer circle (aviation themed)
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.4, 0, 2 * Math.PI);
      ctx.strokeStyle = '#0088FF';
      ctx.lineWidth = size * 0.015;
      ctx.stroke();

      // Inner circle
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.35, 0, 2 * Math.PI);
      ctx.strokeStyle = '#0066CC';
      ctx.lineWidth = size * 0.02;
      ctx.stroke();

      // Letter Z (ZULU)
      ctx.fillStyle = '#0066CC';
      ctx.font = `900 ${size * 0.45}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Z', size / 2, size / 2);

      // Subtle shadow for depth
      ctx.shadowColor = '#0088FF';
      ctx.shadowBlur = size * 0.02;
      ctx.fillText('Z', size / 2, size / 2);
      ctx.shadowBlur = 0;

      // Small accent lines (aviation stripes)
      const lineCount = 3;
      const lineSpacing = size * 0.08;
      const lineWidth = size * 0.15;
      const lineHeight = size * 0.015;

      ctx.fillStyle = '#0088FF';
      for (let i = 0; i < lineCount; i++) {
        const y = size * 0.15 + i * lineSpacing;
        ctx.fillRect(size * 0.15, y, lineWidth, lineHeight);
        ctx.fillRect(size * 0.7, y, lineWidth, lineHeight);
      }
    }

    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    // Generate icons on load
    window.onload = function() {
      drawIcon(document.getElementById('canvas192'));
      drawIcon(document.getElementById('canvas512'));
    };
  </script>
</body>
</html>
